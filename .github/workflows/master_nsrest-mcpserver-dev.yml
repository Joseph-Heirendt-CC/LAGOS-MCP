# Docs: https://github.com/Azure/functions-action

name: Build and deploy dotnet project to Azure Function App - nsrest-mcpserver-dev

on:
  push:
    branches:
      - master
  workflow_dispatch:

env:
  DOTNET_VERSION: '8.0.x'

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Restore dependencies
        run: dotnet restore

      - name: Build
        run: dotnet build --configuration Release

      - name: Publish Azure Functions app
        run: dotnet publish --configuration Release --output ./publish

      - name: Deploy to Azure Function App
        uses: Azure/functions-action@v1
        with:
          app-name: nsrest-mcpserver-dev
          publish-profile: ${{ secrets.AZUREAPPSERVICE_PUBLISHPROFILE_118D22B68FBE4197ADF853947E42B000 }}
          package: ./publish

